name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            importer/pyproject.toml
            backend/pyproject.toml

      - name: Install importer
        run: python -m pip install -e "./importer"

      - name: Install backend
        run: python -m pip install -e "./backend[test]"

      - name: Run backend tests
        run: python -m pytest -q backend/tests
