name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        run: node --check frontend/app.js
