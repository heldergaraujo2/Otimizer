name: Frontend tests

on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/admin.js
          node --check frontend/route-safety.js
          node --check frontend/tests/*.test.js
      - name: Run all frontend tests
        run: node --test frontend/tests/*.test.js
