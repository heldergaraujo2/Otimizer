name: Importer tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-importer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: importer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: importer/pyproject.toml

      - name: Install importer
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest -q
