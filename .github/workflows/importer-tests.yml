name: Importer tests

on:
  push:
    branches: [main]
    paths:
      - "importer/**"
      - ".github/workflows/importer-tests.yml"
  pull_request:
    paths:
      - "importer/**"
      - ".github/workflows/importer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: importer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-importer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: importer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: importer/pyproject.toml

      - name: Install importer
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: importer-pytest-output-${{ github.run_id }}
          path: importer/pytest-output.txt
          if-no-files-found: ignore
