name: Apply admin API integration patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'chore(ci): apply admin API integration patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch licensing repositories and production app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          licensing = Path('backend/src/otimizer_api/licensing.py')
          text = licensing.read_text()
          text = text.replace(
              '    def get_by_id(self, license_id: str) -> License | None: ...\n    def save(self, license_record: License) -> None: ...',
              '    def get_by_id(self, license_id: str) -> License | None: ...\n    def list_all(self) -> list[License]: ...\n    def save(self, license_record: License) -> None: ...'
          )
          text = text.replace(
              '    def get_by_id(self, license_id: str) -> License | None:\n        return self._licenses.get(license_id)\n\n    def get_active_license',
              '    def get_by_id(self, license_id: str) -> License | None:\n        return self._licenses.get(license_id)\n\n    def list_all(self) -> list[License]:\n        return list(self._licenses.values())\n\n    def get_active_license'
          )
          licensing.write_text(text)

          persistence = Path('backend/src/otimizer_api/persistence.py')
          text = persistence.read_text()
          needle = '''    def get_by_id(self, license_id: str) -> License | None:\n        with self.database.connect() as connection:\n            row = connection.execute(_LICENSE_SELECT + " WHERE license_id = ?", (license_id,)).fetchone()\n        return _license_from_row(row)\n\n    def get_active_license'''
          replacement = '''    def get_by_id(self, license_id: str) -> License | None:\n        with self.database.connect() as connection:\n            row = connection.execute(_LICENSE_SELECT + " WHERE license_id = ?", (license_id,)).fetchone()\n        return _license_from_row(row)\n\n    def list_all(self) -> list[License]:\n        with self.database.connect() as connection:\n            rows = connection.execute(_LICENSE_SELECT + " ORDER BY expires_at DESC, license_id ASC").fetchall()\n        return [_license_from_row(row) for row in rows]\n\n    def get_active_license'''
          if needle not in text:
              raise SystemExit('SQLiteLicenseRepository insertion point not found')
          text = text.replace(needle, replacement, 1)
          persistence.write_text(text)

          main = Path('backend/src/otimizer_api/main.py')
          text = main.read_text()
          marker = 'register_admin_routes(app, auth_service=_auth_service, licenses=_license_authorizer.repository, events=_license_events, lifecycle=_license_lifecycle, devices=_device_repository)'
          if marker not in text:
              text += '''\n\nfrom otimizer_api.admin_api import register_admin_routes\nfrom otimizer_api.devices import SQLiteDeviceRepository\nfrom otimizer_api.licensing import LicenseLifecycleService\nfrom otimizer_api.persistence import SQLiteLicenseEventRepository\n\n_license_events = SQLiteLicenseEventRepository(_database)\n_license_lifecycle = LicenseLifecycleService(_license_authorizer.repository, _license_events)\n_device_repository = SQLiteDeviceRepository(_database)\nregister_admin_routes(app, auth_service=_auth_service, licenses=_license_authorizer.repository, events=_license_events, lifecycle=_license_lifecycle, devices=_device_repository)\n'''
          main.write_text(text)
          PY

          python -m compileall -q backend/src
          git diff --check
          git status --short

      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "otimizer-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-admin-api.yml
          git add backend/src/otimizer_api/licensing.py backend/src/otimizer_api/persistence.py backend/src/otimizer_api/main.py
          git commit -m "feat(licensing): wire protected admin API"
          git push
